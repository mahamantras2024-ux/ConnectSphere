name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, coverage, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-test-signing-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run tests
        run: npm test

      - name: Verify coverage
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build --prefix frontend

  scrum85-postgres:
    name: SCRUM-85 PostgreSQL workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connectsphere
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: connectsphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U connectsphere -d connectsphere_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-test-signing-secret
      RUN_DB_TESTS: '1'
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: connectsphere
      DB_PASSWORD: test-only-password
      DB_NAME: connectsphere_test
      DB_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      # Run explicitly with PostgreSQL enabled so this regression cannot silently skip in CI.
      - run: node --test ../tests/backend/scrum85Postgres.test.js
        working-directory: backend

  scrum106-postgres:
    name: SCRUM-106 PostgreSQL workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connectsphere
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: connectsphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U connectsphere -d connectsphere_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-test-signing-secret
      RUN_DB_TESTS: '1'
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: connectsphere
      DB_PASSWORD: test-only-password
      DB_NAME: connectsphere_test
      DB_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      # Run explicitly with PostgreSQL enabled so this regression cannot silently skip in CI.
      - run: node --test ../tests/backend/scrum106Postgres.test.js
        working-directory: backend

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run audit

  package:
    name: Package and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: quackloan-package
          path: |
            artifacts/quackloan.zip
            artifacts/quackloan-sbom.json
          if-no-files-found: error

  smoke:
    name: Package smoke test
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quackloan-package
          path: artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run smoke

  e2e:
    name: Playwright E2E
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
